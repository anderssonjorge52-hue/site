    items.push({ t: A.report === "relatorio" ? "Relatório pronto, sem escrever do zero" : "Evolução em gráfico para mostrar aos pais", s: "Acerto por sessão, palavras que precisam de atenção e um relatório para imprimir ou salvar em PDF." });
    if (A.where === "domiciliar" || A.where === "escola") items.push({ t: "Leve no celular ou no tablet", s: "Abre no navegador, sem instalar nada. Funciona onde você atende." });

    // terminou o quiz: mostra o número por um instante e leva para a página de vendas completa (VSL, teste grátis e preços)
    app.innerHTML = `<section class="screen" style="text-align:center;padding-top:40px">
      <span class="tag">Seu resultado</span>
      <p style="margin-top:16px">Pelas suas respostas, você passa cerca de</p>
      <div class="big" aria-label="${hoursMonth} horas por mês">${hoursMonth}h<small>por mês</small></div>
      <p>montando material e planejando sessões.</p>
      <p class="eq" style="margin-top:18px">Abrindo o vídeo que mostra como o Falalá devolve esse tempo…</p>
    </section>`;
    track("ViewContent", { content_name: "Resultado do quiz", hours: hoursMonth });
    track("QuizComplete", { kids, prep: A.prep, home: A.home, report: A.report, pack: A.pack });
    const dest = new URL("/", location.href);
    utm.forEach((v, k) => dest.searchParams.set(k, v));
    dest.searchParams.set("quiz_h", hoursMonth);
    dest.searchParams.set("quiz_s", sessions);
    setTimeout(() => { location.href = dest.toString(); }, 2200);
  }

  function go(n) {
    step = n;
    setProgress();
    window.scrollTo(0, 0);
    if (step >= Q.length) result(); else question();
    if (step >= 0 && step < Q.length) track("QuizStep", { step: step + 1 });
  }
  back.onclick = () => { if (step > 0) go(step - 1); else intro(); };
  intro();
})();
</script>
</body>
</html>
